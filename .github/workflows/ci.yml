name: CI
on:
  push:
    branches: [main, feat/react-workshop-ui]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install pytest nbclient nbformat ipykernel
      - run: cargo --version && docker compose version && docker info
      - run: corepack enable
      - run: corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          WORKSHOP_REQUIRE_ALL_RUNTIMES: "1"
      - run: pnpm typecheck
      - run: pnpm --dir packages/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots/
            test-results/

  process-portability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The sidecar portability test starts the real API server, which imports web dependencies.
      - run: corepack enable
      - run: corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: node --test packages/adapter-api/runtime.test.mjs packages/web/sidecars.portability.test.mjs packages/web/editors.test.mjs
